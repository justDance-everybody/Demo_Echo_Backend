[project]
name = "echo-agent"
version = "2.0.1"
description = "Echo v2: 一句话语音 Agent。实时语音模型 + 可信工具白名单 + 服务端强制确认。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "mcp>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
echo-server = "echo_agent.server:main"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.ruff.lint.per-file-ignores]
"demo/compose.py" = ["E501"]  # 片头和说明框的 HTML 字符串
