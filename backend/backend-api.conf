[program:backend-api]
command=%(here)s/../monitor_service.sh monitor
directory=%(here)s/..
user=devbox
group=devbox
autostart=true
autorestart=true
startsecs=10
startretries=3
killasgroup=true
stopasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=%(here)s/../logs/supervisor-stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=%(here)s/../logs/supervisor-stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=5
environment=SERVICE_PORT=3000,SERVICE_HOST=localhost,PYTHONPATH=%(here)s/../backend,PATH="%(here)s/../.venv/bin:/usr/local/bin:/usr/bin:/bin"
priority=999
redirect_stderr=false
