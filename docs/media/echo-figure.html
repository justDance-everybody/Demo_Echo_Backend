<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#fff; }
  svg { display:block; font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif; }
  .t { font-size:15px; fill:#1f2430; }
  .s { font-size:12.5px; fill:#5b6270; }
  .m { font-family:"DejaVu Sans Mono",monospace; font-size:12px; fill:#1f2430; }
  .h { font-size:17px; font-weight:700; fill:#11151c; }
  .pl { font-size:19px; font-weight:700; fill:#11151c; }
  .box { fill:#fff; stroke:#3a4150; stroke-width:1.3; }
  .soft { fill:#f4f6f9; stroke:#c5cad3; stroke-width:1; }
  .key { fill:#e9f7f5; stroke:#0f8f80; stroke-width:1.5; }
  .gate { fill:#fff7e0; stroke:#c78a00; stroke-width:1.5; }
  .ln { stroke:#3a4150; stroke-width:1.3; fill:none; }
  .dash { stroke:#9aa1ad; stroke-width:1.1; fill:none; stroke-dasharray:4 4; }
  .bar { fill:#0f8f80; }
  .bar2 { fill:#7cc9bf; }
  .axis { stroke:#3a4150; stroke-width:1; }
  .grid { stroke:#e3e6eb; stroke-width:1; }
</style></head>
<body>
<svg width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4150"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c78a00"/></marker>
  </defs>

  <!-- ================= (a) 结构 ================= -->
  <text x="30" y="40" class="pl">(a)</text>
  <text x="68" y="40" class="h">系统结构：一个实时语音模型 + 一个薄服务端</text>

  <!-- v1 对比条 -->
  <rect x="30" y="60" width="740" height="62" rx="6" class="soft"/>
  <text x="44" y="83" class="s">v1（2025）：一轮对话的串行链路</text>
  <g class="m">
    <text x="44" y="108">浏览器识别 → LLM 选工具 → LLM 生成确认语 → LLM 判断是否 → 执行 → LLM 摘要 → 浏览器合成</text>
  </g>
  <text x="590" y="83" class="s" text-anchor="start">最多 4 次串行 LLM 调用</text>

  <!-- 三列：浏览器 / Echo 服务端 / 实时模型 -->
  <rect x="30" y="150" width="170" height="250" rx="8" class="box"/>
  <text x="115" y="180" class="t" text-anchor="middle" font-weight="700">浏览器</text>
  <text x="115" y="210" class="s" text-anchor="middle">麦克风 → PCM16</text>
  <text x="115" y="232" class="s" text-anchor="middle">扬声器 ← PCM16</text>
  <text x="115" y="254" class="s" text-anchor="middle">打断：开口即停播</text>
  <text x="115" y="300" class="s" text-anchor="middle">没有执行接口</text>
  <text x="115" y="322" class="s" text-anchor="middle">没有模型密钥</text>

  <rect x="250" y="150" width="300" height="250" rx="8" class="box"/>
  <text x="400" y="180" class="t" text-anchor="middle" font-weight="700">Echo 服务端（约 1000 行 Python）</text>
  <rect x="268" y="196" width="264" height="44" rx="5" class="soft"/>
  <text x="400" y="223" class="t" text-anchor="middle">会话中继 · 首字延迟 · 日志</text>
  <rect x="268" y="250" width="264" height="58" rx="5" class="gate"/>
  <text x="400" y="274" class="t" text-anchor="middle">工具执行 + 确认闸</text>
  <text x="400" y="296" class="s" text-anchor="middle">写操作：登记、锁参数、等用户开口</text>
  <rect x="268" y="318" width="264" height="64" rx="5" class="key"/>
  <text x="400" y="342" class="t" text-anchor="middle">tools.yaml 白名单（≤ 40 个）</text>
  <text x="400" y="364" class="s" text-anchor="middle">内置工具 · 远程 MCP（逐个放行）</text>

  <rect x="600" y="150" width="170" height="250" rx="8" class="box"/>
  <text x="685" y="180" class="t" text-anchor="middle" font-weight="700">实时语音模型</text>
  <text x="685" y="210" class="s" text-anchor="middle">Qwen3.8-Omni-Flash</text>
  <text x="685" y="230" class="s" text-anchor="middle">-Realtime（默认）</text>
  <text x="685" y="252" class="s" text-anchor="middle">或 OpenAI Realtime</text>
  <text x="685" y="300" class="s" text-anchor="middle">听 · 选工具 · 说</text>
  <text x="685" y="322" class="s" text-anchor="middle">只能“提出”调用</text>

  <line x1="200" y1="212" x2="250" y2="212" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <line x1="550" y1="212" x2="600" y2="212" class="ln" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="225" y="140" class="s" text-anchor="middle">WebSocket</text>
  <text x="575" y="140" class="s" text-anchor="middle">Realtime WS</text>
  <line x1="600" y1="280" x2="532" y2="280" class="ln" marker-end="url(#a)"/>
  <text x="566" y="272" class="s" text-anchor="middle" font-size="11">调用请求</text>
  <line x1="532" y1="300" x2="600" y2="300" class="dash" marker-end="url(#a)"/>
  <text x="566" y="318" class="s" text-anchor="middle" font-size="11">结果</text>

  <!-- ================= (b) 确认闸时序 ================= -->
  <text x="830" y="40" class="pl">(b)</text>
  <text x="868" y="40" class="h">确认闸：写操作必须等用户开口（实录时序）</text>
  <!-- 三条泳道 -->
  <g>
    <text x="900" y="80" class="t" text-anchor="middle" font-weight="700">用户</text>
    <text x="1170" y="80" class="t" text-anchor="middle" font-weight="700">模型</text>
    <text x="1440" y="80" class="t" text-anchor="middle" font-weight="700">Echo 服务端</text>
    <line x1="900" y1="92" x2="900" y2="430" class="dash"/>
    <line x1="1170" y1="92" x2="1170" y2="430" class="dash"/>
    <line x1="1440" y1="92" x2="1440" y2="430" class="dash"/>
  </g>
  <g class="s">
    <line x1="900" y1="115" x2="1168" y2="115" class="ln" marker-end="url(#a)"/>
    <text x="1034" y="108" text-anchor="middle">“帮我记一下，明天下午三点跟投资人开会”</text>
    <line x1="1170" y1="150" x2="1438" y2="150" class="ln" marker-end="url(#a)"/>
    <text x="1304" y="143" text-anchor="middle" class="m">save_memo{text}</text>
    <rect x="1300" y="162" width="280" height="44" rx="5" class="gate"/>
    <text x="1440" y="181" text-anchor="middle">不执行：登记 action、锁定参数</text>
    <text x="1440" y="199" text-anchor="middle">记下此刻的用户发言计数 n</text>
    <line x1="1438" y1="222" x2="1172" y2="222" class="dash" marker-end="url(#a)"/>
    <text x="1304" y="216" text-anchor="middle">summary + action_id</text>
    <line x1="1168" y1="252" x2="902" y2="252" class="ln" marker-end="url(#a)"/>
    <text x="1034" y="245" text-anchor="middle">“要帮你记下这条备忘：……确认吗？”</text>
    <line x1="900" y1="292" x2="1168" y2="292" class="ln" marker-end="url(#a)"/>
    <text x="1034" y="285" text-anchor="middle">“好的，记吧。”（发言计数 → n+1）</text>
    <line x1="1170" y1="322" x2="1438" y2="322" class="ln" marker-end="url(#a)"/>
    <text x="1304" y="315" text-anchor="middle" class="m">confirm_action(action_id)</text>
    <rect x="1300" y="334" width="280" height="44" rx="5" class="key"/>
    <text x="1440" y="353" text-anchor="middle">检查 n+1 &gt; n ✓ → 执行登记时的参数</text>
    <text x="1440" y="371" text-anchor="middle">过期时间 120 s</text>
    <line x1="1168" y1="408" x2="902" y2="408" class="ln" marker-end="url(#a)"/>
    <text x="1034" y="401" text-anchor="middle">“记好了。”</text>
  </g>
  <rect x="830" y="446" width="740" height="40" rx="6" class="soft"/>
  <text x="846" y="471" class="s">反例（自动化测试覆盖）：用户开口前模型就调用 confirm_action → 服务端拒绝；前端没有任何能直接执行工具的接口。</text>

  <!-- ================= (c) 实测 ================= -->
  <text x="30" y="530" class="pl">(c)</text>
  <text x="68" y="530" class="h">实测首字延迟：用户说完 → 听到第一个字</text>
  <text x="68" y="554" class="s">Qwen3.8-Omni-Flash-Realtime，北京地域；13 条用例 × 3 轮 = 39 次，文字输入（不含语音识别误差）；2026-11-24</text>

  <!-- 横向条形图，0–4 s -->
  <g transform="translate(250,580)">
    <!-- 网格 -->
    <g class="s" text-anchor="middle">
      <line x1="0" y1="0" x2="0" y2="250" class="axis"/>
      <line x1="125" y1="0" x2="125" y2="250" class="grid"/>
      <line x1="250" y1="0" x2="250" y2="250" class="grid"/>
      <line x1="375" y1="0" x2="375" y2="250" class="grid"/>
      <line x1="500" y1="0" x2="500" y2="250" class="grid"/>
      <line x1="0" y1="250" x2="500" y2="250" class="axis"/>
      <text x="0" y="272">0</text><text x="125" y="272">1 s</text><text x="250" y="272">2 s</text>
      <text x="375" y="272">3 s</text><text x="500" y="272">4 s</text>
    </g>
    <!-- 每类：中位数条 + 最小–最大须线；宽度 = ms × 0.125 -->
    <g class="s" text-anchor="end">
      <text x="-12" y="24">直接回答（无工具）</text>
      <rect x="0" y="10" width="102" height="22" class="bar"/>
      <line x1="94.5" y1="21" x2="110" y2="21" stroke="#11151c"/>
      <text x="118" y="26" text-anchor="start" class="m">0.82 s</text>

      <text x="-12" y="64">calculate</text>
      <rect x="0" y="50" width="124" height="22" class="bar"/>
      <line x1="100.5" y1="61" x2="412" y2="61" stroke="#11151c"/>
      <text x="420" y="66" text-anchor="start" class="m">0.99 s</text>

      <text x="-12" y="104">list_memos</text>
      <rect x="0" y="90" width="186" height="22" class="bar"/>
      <line x1="177.5" y1="101" x2="189" y2="101" stroke="#11151c"/>
      <text x="198" y="106" text-anchor="start" class="m">1.49 s</text>

      <text x="-12" y="144">get_time</text>
      <rect x="0" y="130" width="190" height="22" class="bar"/>
      <line x1="164.5" y1="141" x2="260" y2="141" stroke="#11151c"/>
      <text x="268" y="146" text-anchor="start" class="m">1.52 s</text>

      <text x="-12" y="184">save_memo（到念出确认语）</text>
      <rect x="0" y="170" width="207" height="22" class="bar"/>
      <line x1="179.5" y1="181" x2="262.5" y2="181" stroke="#11151c"/>
      <text x="271" y="186" text-anchor="start" class="m">1.66 s</text>

      <text x="-12" y="224">get_weather（外部 API ≈1.9 s）</text>
      <rect x="0" y="210" width="418" height="22" class="bar2"/>
      <line x1="413" y1="221" x2="537.5" y2="221" stroke="#11151c"/>
      <text x="546" y="226" text-anchor="start" class="m">3.35 s</text>
    </g>
  </g>
  <text x="250" y="880" class="s">条 = 中位数，须线 = 最小–最大。天气慢主要在两次串行的外部 HTTP 请求，不在模型。</text>

  <!-- 右侧：数字 -->
  <g transform="translate(900,580)">
    <rect x="0" y="0" width="670" height="280" rx="8" class="soft"/>
    <text x="30" y="52" class="h" style="font-size:44px;fill:#0f8f80">39 / 39</text>
    <text x="230" y="38" class="t">任务办成</text>
    <text x="230" y="60" class="s">调用了对的工具且参数对；或简单算术直接答对</text>
    <text x="30" y="122" class="h" style="font-size:44px;fill:#11151c">34 / 39</text>
    <text x="230" y="108" class="t">第一步就选对工具</text>
    <text x="230" y="130" class="s">另 5 次：4 次算术心算（答案正确），1 次先查时间再记备忘</text>
    <text x="30" y="192" class="h" style="font-size:44px;fill:#11151c">1.51 s</text>
    <text x="230" y="178" class="t">首字延迟中位数（p90 3.35 s）</text>
    <text x="230" y="200" class="s">39 次全部样本；demo 实录（真语音）中各轮 0.58–1.32 s，天气 3.2 s</text>
    <text x="30" y="252" class="s">复现：uv run python eval/run.py --repeat 3（需要模型密钥）</text>
  </g>
</svg>
</body></html>
