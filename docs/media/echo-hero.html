<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px;
    height: 620px;
    overflow: hidden;
    background: transparent;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    position: relative;
    width: 1920px;
    height: 620px;
    background:
      radial-gradient(680px 520px at 80% 48%, rgba(20, 184, 166, 0.22) 0%, rgba(15, 118, 110, 0.08) 42%, rgba(7, 11, 18, 0) 74%),
      radial-gradient(520px 360px at 14% 12%, rgba(56, 189, 248, 0.08) 0%, rgba(7, 11, 18, 0) 70%),
      linear-gradient(135deg, #070b12 0%, #0b1220 55%, #070d16 100%);
    border: 2px solid rgba(45, 212, 191, 0.22);
    border-radius: 24px;
    overflow: hidden;
  }
  /* Subtle precision grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 65%, rgba(0,0,0,0.7) 100%);
  }
  /* Top luminous accent hairline */
  .top-glow {
    position: absolute;
    top: 0;
    left: 88px;
    width: 520px;
    height: 3px;
    background: linear-gradient(90deg, #2dd4bf 0%, #38bdf8 55%, transparent 100%);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    width: 100%;
    height: 100%;
    padding: 58px 84px 52px 88px;
    justify-content: space-between;
    align-items: center;
  }

  .left {
    width: 1210px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    width: fit-content;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(20, 184, 166, 0.11);
    border: 1px solid rgba(45, 212, 191, 0.34);
    color: #5eead4;
    font-family: "Noto Sans Mono", monospace;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #2dd4bf;
    box-shadow: 0 0 12px #2dd4bf;
  }

  .title-block {
    margin-top: 10px;
  }
  .brand-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 12px;
  }
  .brand {
    font-family: "Noto Sans Mono", "Noto Sans CJK SC", sans-serif;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #f8fafc;
    line-height: 1;
  }
  .brand-tag {
    font-family: "Noto Sans Mono", monospace;
    font-size: 18px;
    font-weight: 600;
    color: #2dd4bf;
    padding: 5px 13px;
    border-radius: 8px;
    background: rgba(45, 212, 191, 0.1);
    border: 1px solid rgba(45, 212, 191, 0.28);
    letter-spacing: 0.06em;
  }
  .headline {
    font-size: 62px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.015em;
    color: #ffffff;
  }
  .headline .accent {
    background: linear-gradient(90deg, #5eead4 0%, #38bdf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subhead {
    margin-top: 18px;
    font-size: 25px;
    font-weight: 500;
    color: #cbd5e1;
    letter-spacing: 0.01em;
  }
  .subhead strong {
    color: #f8fafc;
    font-weight: 700;
  }
  .sep {
    color: #2dd4bf;
    margin: 0 14px;
    font-weight: 700;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-top: 26px;
  }
  .metric {
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.16);
    border-radius: 14px;
    padding: 16px 20px;
  }
  .metric.hi {
    border-color: rgba(45, 212, 191, 0.36);
    background: rgba(15, 32, 39, 0.78);
  }
  .metric-val {
    font-family: "Noto Sans Mono", "Noto Sans CJK SC", sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #f8fafc;
    line-height: 1.15;
  }
  .metric.hi .metric-val {
    color: #5eead4;
  }
  .metric-lbl {
    margin-top: 6px;
    font-size: 17px;
    color: #cbd5e1;
    font-weight: 500;
  }

  /* Right visual: Echo Acoustic Orb + Deterministic Gate */
  .right {
    position: relative;
    width: 500px;
    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .right svg {
    width: 500px;
    height: 500px;
    overflow: visible;
  }
  .chip {
    position: absolute;
    padding: 8px 15px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid rgba(45, 212, 191, 0.32);
    color: #e2e8f0;
    font-family: "Noto Sans Mono", "Noto Sans CJK SC", sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    white-space: nowrap;
  }
  .chip .c-teal { color: #5eead4; }
  .chip-top { top: 14px; right: 10px; }
  .chip-mid { left: -78px; top: 230px; border-color: rgba(56, 189, 248, 0.38); }
  .chip-bot { bottom: 16px; right: 10px; border-color: rgba(250, 204, 21, 0.45); color: #fef08a; }
</style>
</head>
<body>
<div class="canvas">
  <div class="grid"></div>
  <div class="top-glow"></div>
  <div class="content">
    <div class="left">
      <div class="eyebrow"><span class="dot"></span>VOICE-NATIVE ACTION RUNTIME · SINCE 2025</div>

      <div class="title-block">
        <div class="brand-row">
          <div class="brand">EchoOS</div>
          <div class="brand-tag">v2.0 · MIT OPEN SOURCE</div>
        </div>
        <div class="headline">让声音成为真实软件的<span class="accent">执行界面</span></div>
        <div class="subhead">后 App 时代的语音原生执行系统<span class="sep">·</span><strong>概率交给大模型，边界交给确定性代码</strong></div>
      </div>

      <div class="metrics">
        <div class="metric hi">
          <div class="metric-val">1.51 s</div>
          <div class="metric-lbl">实测中位首字延迟</div>
        </div>
        <div class="metric">
          <div class="metric-val">39 / 39</div>
          <div class="metric-lbl">真模型任务办成</div>
        </div>
        <div class="metric hi">
          <div class="metric-val">0 次</div>
          <div class="metric-lbl">实测未确认写执行</div>
        </div>
        <div class="metric">
          <div class="metric-val">&lt; 1,000 行</div>
          <div class="metric-lbl">可审计核心 Python</div>
        </div>
      </div>
    </div>

    <div class="right">
      <svg viewBox="0 0 500 500">
        <defs>
          <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.72"/>
            <stop offset="35%" stop-color="#14b8a6" stop-opacity="0.28"/>
            <stop offset="70%" stop-color="#0f766e" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#070b12" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#5eead4" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25"/>
          </linearGradient>
          <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.15"/>
          </linearGradient>
        </defs>
        <!-- Ambient glow -->
        <circle cx="250" cy="250" r="220" fill="url(#orbGlow)"/>
        <!-- Outer precision dashed gate ring -->
        <circle cx="250" cy="250" r="206" fill="none" stroke="rgba(148,163,184,0.22)" stroke-width="1.5" stroke-dasharray="6 8"/>
        <circle cx="250" cy="250" r="172" fill="none" stroke="rgba(45,212,191,0.28)" stroke-width="1.5"/>
        <!-- Organic voice wave rings (mirroring Echo UI) -->
        <ellipse cx="250" cy="250" rx="142" ry="126" transform="rotate(-14 250 250)" fill="none" stroke="url(#ringGrad1)" stroke-width="2.4"/>
        <ellipse cx="250" cy="250" rx="124" ry="140" transform="rotate(24 250 250)" fill="none" stroke="url(#ringGrad2)" stroke-width="2.0"/>
        <ellipse cx="250" cy="250" rx="108" ry="96" transform="rotate(-32 250 250)" fill="none" stroke="rgba(94,234,212,0.75)" stroke-width="2.2"/>
        <circle cx="250" cy="250" r="82" fill="rgba(15, 23, 42, 0.55)" stroke="#5eead4" stroke-width="2"/>
        <!-- Audio waveform bars inside core -->
        <g fill="#5eead4">
          <rect x="206" y="238" width="6" height="24" rx="3" opacity="0.55"/>
          <rect x="219" y="224" width="6" height="52" rx="3" opacity="0.8"/>
          <rect x="232" y="206" width="6" height="88" rx="3"/>
          <rect x="245" y="216" width="6" height="68" rx="3" fill="#38bdf8"/>
          <rect x="258" y="198" width="6" height="104" rx="3"/>
          <rect x="271" y="222" width="6" height="56" rx="3" opacity="0.85"/>
          <rect x="284" y="236" width="6" height="28" rx="3" opacity="0.6"/>
        </g>
        <!-- Precision axis ticks -->
        <line x1="250" y1="24" x2="250" y2="44" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="250" y1="456" x2="250" y2="476" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="24" y1="250" x2="44" y2="250" stroke="#2dd4bf" stroke-width="2"/>
        <line x1="456" y1="250" x2="476" y2="250" stroke="#2dd4bf" stroke-width="2"/>
      </svg>
      <div class="chip chip-top"><span class="c-teal">●</span> Qwen-Omni · OpenAI Realtime</div>
      <div class="chip chip-mid"><span class="c-teal">⚡</span> Streamable HTTP MCP</div>
      <div class="chip chip-bot">🔒 写操作服务端锁参 · 口头放行</div>
    </div>
  </div>
</div>
</body>
</html>
