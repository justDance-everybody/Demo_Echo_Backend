name: 前端CI检查流程

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'frontend/**'
      - 'docs/前端开发文档.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'docs/前端开发文档.md'

jobs:
  前端代码质量检查:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4

      - name: 📦 设置Node.js环境 
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 🔧 安装依赖
        run: npm ci

      - name: 🎨 代码格式检查
        run: |
          if [ -f "package.json" ] && grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "⚠️ 未配置lint脚本，跳过代码格式检查"
          fi

      - name: 🏗️ 构建检查
        run: |
          if [ -f "package.json" ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "⚠️ 未配置build脚本，跳过构建检查"
          fi

      - name: 🧪 运行Cypress测试
        run: |
          if [ -f "cypress.config.js" ]; then
            # 启动开发服务器（后台运行）
            npm start &
            SERVER_PID=$!
            
            # 等待服务器启动
            sleep 30
            
            # 运行Cypress测试
            npx cypress run --reporter json --reporter-options toConsole=false > reports/test-results.json || true
            
            # 停止服务器
            kill $SERVER_PID
            
            # 显示测试结果
            if [ -f "reports/test-results.json" ]; then
              echo "✅ Cypress测试完成，查看详细报告"
              cat reports/test-results.json | jq '.stats // {}'
            fi
          else
            echo "⚠️ 未找到Cypress配置，跳过E2E测试"
          fi

      - name: 📊 上传测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cypress-reports
          path: |
            frontend/cypress/reports/
            frontend/reports/
          retention-days: 7

  安全检查:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        
    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4
        
      - name: 🔐 依赖安全检查
        run: |
          if [ -f "package-lock.json" ]; then
            npm audit --audit-level=high
          else
            echo "⚠️ 未找到package-lock.json，跳过安全检查"
          fi

