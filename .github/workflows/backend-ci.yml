    """测试环境配置"""
    assert os.getenv('ENV') == 'test'
    print("✅ 测试环境配置正确")
EOF
            pytest tests/test_health.py -v
          fi

      - name: 🌐 API服务启动测试
        run: |
          # 尝试启动服务并测试健康检查
          echo "测试API服务启动..."
          
          # 后台启动服务
          if [ -f "main.py" ]; then
            python main.py &
          elif [ -f "app/main.py" ]; then
            cd app && python main.py &
          elif [ -f "run.py" ]; then
            python run.py &
          else
            echo "未找到启动文件，跳过服务测试"
            exit 0
          fi
          
          SERVER_PID=$!
          sleep 10
          
          # 测试健康检查端点
          curl -f http://localhost:3000/health || curl -f http://localhost:8000/health || echo "健康检查端点不可用"
          
          # 停止服务
          kill $SERVER_PID 2>/dev/null || true

