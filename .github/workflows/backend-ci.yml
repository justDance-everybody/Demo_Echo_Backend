          # 创建数据库安全检查脚本
          cat > db_security_check.py << 'EOF'
import os
import re
import glob

def check_sql_injection_patterns():
    """检查可能的SQL注入漏洞"""
    dangerous_patterns = [
        r'(\+\s*["\']).*sql',  # 字符串拼接SQL
        r'f["\'].*select.*{',   # f-string中的SQL
        r'\.format\(.*select',  # format方法拼接SQL
        r'%.*select.*%',        # %格式化SQL
    ]
    
    issues = []
    python_files = glob.glob('**/*.py', recursive=True)
    
    for file_path in python_files:
        if 'venv' in file_path or '__pycache__' in file_path:
            continue
            
        try:
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
                for i, line in enumerate(content.split('\n'), 1):
                    for pattern in dangerous_patterns:
                        if re.search(pattern, line, re.IGNORECASE):
                            issues.append(f"{file_path}:{i} - 可能的SQL注入风险: {line.strip()}")
        except Exception:
            continue
    
    return issues

def check_database_credentials():
    """检查数据库凭据安全"""
    issues = []
    
    # 检查是否有硬编码的数据库密码
    python_files = glob.glob('**/*.py', recursive=True)
    
    for file_path in python_files:
        if 'venv' in file_path or '__pycache__' in file_path:
            continue
            
        try:
            with open(file_path, 'r', encoding='utf-8') as f:
                content = f.read()
                # 检查硬编码密码模式
                if re.search(r'password\s*=\s*["\'][^"\']{3,}["\']', content, re.IGNORECASE):
                    issues.append(f"{file_path} - 可能存在硬编码数据库密码")
        except Exception:
            continue
    
    return issues

if __name__ == "__main__":
    print("== 数据库安全检查 ==")
    
    sql_issues = check_sql_injection_patterns()
    if sql_issues:
        print("🚨 发现潜在SQL注入风险:")
        for issue in sql_issues[:5]:  # 只显示前5个
            print(f"  - {issue}")
        if len(sql_issues) > 5:
            print(f"  - 还有 {len(sql_issues) - 5} 个其他问题...")
    else:
        print("✅ 未发现明显的SQL注入风险")
    
    cred_issues = check_database_credentials()
    if cred_issues:
        print("🚨 发现数据库凭据安全问题:")
        for issue in cred_issues:
            print(f"  - {issue}")
    else:
        print("✅ 数据库凭据配置安全")
    
    # 如果发现严重问题，退出码为1
    if sql_issues or cred_issues:
        print(f"\n📊 总计发现 {len(sql_issues) + len(cred_issues)} 个安全问题")
        exit(1)
    else:
        print("\n✅ 数据库安全检查通过")
