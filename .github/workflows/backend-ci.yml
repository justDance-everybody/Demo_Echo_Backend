name: 后端API服务CI检查

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'backend/**'
      - 'app/**'
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.env.example'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'app/**' 
      - '*.py'
      - 'requirements.txt'
      - 'pyproject.toml'

jobs:
  后端代码质量检查:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: ai_assistant_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 📥 下载代码
        uses: actions/checkout@v4

      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          else
            echo "⚠️ 未找到依赖文件，跳过安装"
          fi
          # 安装开发和测试依赖
          pip install pytest pytest-asyncio httpx black flake8 mypy

      - name: 🎨 代码格式检查
        run: |
          echo "检查代码格式..."
          black --check --diff . || echo "代码格式需要调整，但不阻断CI"
          
      - name: 🔍 代码规范检查  
        run: |
          echo "检查代码规范..."
          flake8 --max-line-length=100 --ignore=E203,W503 . || echo "代码规范有问题，但不阻断CI"

      - name: 🔧 配置测试环境
        run: |
          # 创建测试用的环境变量文件
          cat > .env.test << EOF
          DATABASE_URL="mysql+pymysql://root:test_password@localhost:3306/ai_assistant_test"
          JWT_SECRET="test-secret-key-for-ci"
          LLM_API_KEY="test-api-key"
          LLM_API_BASE="https://api.test.com/v1"
          ENV="test"
          DEBUG=False
          USE_MOCK_RESPONSES=true
          EOF
          
      - name: 🗄️ 数据库迁移测试
        run: |
          # 等待MySQL完全启动
          sleep 10
          
          # 运行数据库迁移（如果有）
          if [ -f "alembic.ini" ]; then
            echo "运行Alembic迁移..."
            alembic upgrade head
          elif [ -f "create_tables.py" ]; then
            echo "运行表创建脚本..."
            python create_tables.py
          else
            echo "未找到数据库迁移脚本，跳过"
          fi

      - name: 🧪 运行单元测试
        run: |
          if [ -d "tests" ] || [ -f "test_*.py" ]; then
            echo "运行单元测试..."
            pytest -v --tb=short
          else
            echo "⚠️ 未找到测试文件，跳过测试"
            # 创建一个基础的健康检查测试
            mkdir -p tests
            cat > tests/test_health.py << 'EOF'
import sys
import os
sys.path.append(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

def test_imports():
    """测试基础模块导入"""
    try:
        # 根据你的项目结构调整导入
        if os.path.exists('app'):
            import app
        elif os.path.exists('main.py'):
            import main
        print("✅ 基础模块导入成功")
        assert True
    except Exception as e:
        print(f"❌ 模块导入失败: {e}")
        assert False, f"模块导入失败: {e}"

