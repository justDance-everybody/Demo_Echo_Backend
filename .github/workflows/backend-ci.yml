import httpx
import json
import time
import sys
import asyncio

async def test_api_endpoints():
    """测试主要API端点"""
    base_url = "http://localhost:3000"
    
    async with httpx.AsyncClient() as client:
        results = []
        
        # 测试健康检查
        try:
            response = await client.get(f"{base_url}/health", timeout=10)
            results.append(("健康检查", response.status_code == 200, response.elapsed.total_seconds()))
        except Exception as e:
            results.append(("健康检查", False, 0))
        
        # 测试登录接口
        try:
            login_data = {"username": "testuser_ci", "password": "test123"}
            response = await client.post(f"{base_url}/api/v1/auth/login", json=login_data, timeout=10)
            results.append(("用户登录", response.status_code in [200, 401], response.elapsed.total_seconds()))
        except Exception as e:
            results.append(("用户登录", False, 0))
        
        # 测试工具列表接口
        try:
            response = await client.get(f"{base_url}/api/v1/tools", timeout=10)
            results.append(("工具列表", response.status_code in [200, 401], response.elapsed.total_seconds()))
        except Exception as e:
            results.append(("工具列表", False, 0))
        
        # 输出结果
        print("== API测试结果 ==")
        total_tests = len(results)
        passed_tests = sum(1 for _, passed, _ in results if passed)
        
        for test_name, passed, duration in results:
            status = "✅" if passed else "❌"
            print(f"{status} {test_name}: {duration:.3f}s")
        
        print(f"\n📊 通过率: {passed_tests}/{total_tests} ({passed_tests/total_tests*100:.1f}%)")
        
        # 性能警告
        slow_tests = [(name, duration) for name, passed, duration in results if duration > 2.0 and passed]
        if slow_tests:
            print("\n⚠️ 性能警告（响应时间>2秒）:")
            for name, duration in slow_tests:
                print(f"  - {name}: {duration:.3f}s")
        
        return passed_tests >= total_tests * 0.7  # 70%通过率

if __name__ == "__main__":
    success = asyncio.run(test_api_endpoints())
    sys.exit(0 if success else 1)
EOF
          
