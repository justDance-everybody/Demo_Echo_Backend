# 意图评测集：一句话 → 期望模型调用的工具（null 表示应该直接回答，不调工具）。
# args 只检查列出的字段，值做子串匹配。
# reply_any：没调工具但回答里出现其中任一字符串也算办成（简单算术模型常直接心算）。
- text: 现在几点了
  tool: get_time
- text: 今天星期几
  tool: get_time
- text: 帮我算一下一百二十八乘以三十七
  tool: calculate
  reply_any: ["4736", "四千七百三十六"]
- text: 三千块钱打八五折是多少
  tool: calculate
  reply_any: ["2550", "两千五百五十"]
- text: 武汉今天天气怎么样
  tool: get_weather
  args: {city: 武汉}
- text: 明天北京会下雨吗
  tool: get_weather
  args: {city: 北京}
- text: 上海这周末冷不冷
  tool: get_weather
  args: {city: 上海}
- text: 帮我记一下明天下午三点开会
  tool: save_memo
  args: {text: 开会}
- text: 记个备忘，周五前交电费
  tool: save_memo
  args: {text: 电费}
- text: 我之前记了什么
  tool: list_memos
- text: 你好
  tool: null
- text: 讲个笑话
  tool: null
- text: 谢谢你
  tool: null
